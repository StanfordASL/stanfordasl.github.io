name: Publication reminders

on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC = 6am PST / 7am PDT
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (print only), send, or init (baseline, no emails)'
        default: dry-run

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run reminder script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FALLBACK_EMAIL: ${{ secrets.FALLBACK_EMAIL }}
        run: |
          mode="${{ github.event.inputs.mode || 'send' }}"
          case "$mode" in
            send)  python3 scripts/publication_reminders.py --send ;;
            init)  python3 scripts/publication_reminders.py --init ;;
            *)     python3 scripts/publication_reminders.py ;;
          esac
      - name: Save reminder state
        run: |
          git config user.name "asl-reminder-bot"
          git config user.email "noreply@github.com"
          git add scripts/publication_reminders_state.json || true
          git diff --cached --quiet || (git commit -m "Update publication reminder state [skip ci]" && git push)
